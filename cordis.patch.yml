# @zoytown/dsh-avatar bundle patch: insert this plugin's row into the profile
# roster. One row mounts both halves — the browser half is driven by the
# `dsh.client` declaration in package.json, not by a second row.
#
# Install:
#   npx -y @deepseek-ai/dsh plugin --profile web add @zoytown/dsh-avatar
- insert:
    - id: dsh-avatar
      name: '@zoytown/dsh-avatar'
      config:
        maxImageBytes: 20971520
        trustedHosts: []
